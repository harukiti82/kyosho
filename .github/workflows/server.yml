# オンライン対戦サーバー（server/）の型チェックとテスト。Cloudflare へのデプロイは deploy.yml。
# サーバーは web/src/engine と web/src/net を import するので、web 側の変更でも走らせる。
name: Server tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # wrangler types で worker-configuration.d.ts を作ってから tsc --noEmit
      - run: npm run typecheck
      # Workers ランタイム（workerd）の上で Durable Object・WebSocket・alarm を含めて確かめる
      - run: npm test
