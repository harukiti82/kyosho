<!doctype html>
<!-- OGP の画像（1200×630）。web/capture/promo.spec.ts が web/public/ogp.png に撮る。盤面は録画した対局の切り抜き（parts/board.png） -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="card.css" />
    <style>
      .left {
        position: absolute;
        left: 72px;
        top: 70px;
        width: 560px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 28px;
      }
      .mark {
        width: 150px;
        height: 150px;
      }
      .kicker {
        font-size: 24px;
        margin-bottom: 10px;
      }
      .word {
        font-size: 148px;
      }
      .tag {
        margin-top: 64px;
        margin-left: 30px;
        --stone: 64px;
      }
      .tag .plate {
        font-size: 34px;
        padding: 10px 46px;
      }
      .sub {
        margin-top: 40px;
        font-size: 28px;
        font-weight: 700;
        color: var(--ink-muted);
        text-shadow: var(--soft-shadow);
      }
      .shot {
        right: 56px;
        top: 50px;
        width: 500px;
      }
    </style>
  </head>
  <body>
    <div class="left">
      <div class="brand">
        <svg class="mark" viewBox="0 0 120 120" aria-hidden="true"><g transform="skewX(-12) translate(12 0)"><rect class="board-sq" x="8" y="8" width="104" height="104" /><path class="grid" d="M60 8V112M8 60H112" /><circle class="black" cx="34" cy="34" r="20" /><circle class="white" cx="86" cy="34" r="20" /><circle class="black" cx="86" cy="86" r="20" /><polygon class="white" points="34,63 49.2,72.2 53,109 15,109 18.8,72.2" /></g></svg>
        <div>
          <div class="kicker">きょうしょう</div>
          <div class="word">挟将</div>
        </div>
      </div>
      <div class="pinch tag"><span class="plate">挟んだ駒の数字がダメージ</span></div>
      <p class="sub">リバーシ盤の二人対戦ボードゲーム</p>
    </div>
    <div class="shot"><img src="parts/board.png" alt="" /></div>
  </body>
</html>
