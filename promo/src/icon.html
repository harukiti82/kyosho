<!doctype html>
<!-- 正方形のアイコン（apple-touch-icon 180×180・投稿サイト用 512×512）。favicon.svg をそのまま画面いっぱいに描く -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0c4fd2;
      }
      img {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <img src="../../web/public/favicon.svg" alt="" />
  </body>
</html>
