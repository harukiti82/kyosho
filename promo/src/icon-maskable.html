<!doctype html>
<!-- PWA の maskable アイコン（512×512）。端末が丸や角丸に切り抜いても欠けないよう、favicon.svg を中央の 60% に縮めて青い地に置く -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0c4fd2;
      }
      body {
        display: grid;
        place-items: center;
      }
      img {
        display: block;
        width: 60%;
        height: 60%;
      }
    </style>
  </head>
  <body>
    <img src="../../web/public/favicon.svg" alt="" />
  </body>
</html>
